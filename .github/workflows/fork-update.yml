# Takes an upstream release into this fork, keeps every fork change, gates it, then
# publishes a fork release the desktop app's update button can install.
#
# Two jobs on purpose. The gate runs on ubuntu-latest because the server and shared
# test suites cannot pass on Windows yet (#80), so a Windows gate is red before it
# starts. Everything that has to be Windows - the unsigned installer and the release
# smoke check - runs on windows-latest. See docs/operations/fork-windows-build.md.
name: Fork Update

on:
  schedule:
    # Look for a new upstream stable release each morning. Most mornings there is none, and
    # the run stops at the resolve step. Nightlies are never taken.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Ref to merge. Empty means the newest upstream stable release tag."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Stop before publish and before push. Upload the installer as an artifact instead."
        required: false
        default: true
        type: boolean

concurrency:
  group: fork-update
  cancel-in-progress: false

permissions: {}

env:
  UPSTREAM_REMOTE: https://github.com/pingdotgg/t3code
  FORK_DEFAULT_BRANCH: main

jobs:
  gate:
    name: Merge upstream and gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    outputs:
      upstream_ref: ${{ steps.resolve.outputs.upstream_ref }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      up_to_date: ${{ steps.resolve.outputs.up_to_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Whole tree and whole history, and no sparse-checkout, although ci.yml uses one to
          # skip .repos/. Asking for a sparse checkout makes actions/checkout clone with
          # --filter=blob:none, which leaves origin as the promisor for every blob. The merge
          # below then asks origin for upstream's blobs, and origin only holds the ones the
          # fork has already merged, so a new upstream tag dies with
          # "upload-pack: not our ref". Run 34375854944 is that failure.
          fetch-depth: 0
          # No persist-credentials: false here. That makes checkout run its "Removing auth"
          # step, which runs `git submodule foreach` over the index. .repos/alchemy-effect
          # carries a gitlink with no .gitmodules entry, so that call exits 128 and fails the
          # job. This job only has contents: read, so a persisted token cannot push anyway.

      - name: Resolve the upstream ref and the run mode
        id: resolve
        shell: bash
        env:
          INPUT_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REMOTE"
          git fetch --tags --force upstream
          # Fork branches too, so `upstream_ref` can name one. That is how the conflict path
          # is exercised without pushing anything to upstream.
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'

          # A scheduled run is the real pipeline. Anything else rehearses unless told otherwise.
          if [ "$EVENT_NAME" = "schedule" ]; then
            dry_run=false
          else
            dry_run="${INPUT_DRY_RUN:-true}"
          fi

          # A real run publishes and pushes, so it may only run from the default branch.
          if [ "$dry_run" != "true" ] && [ "$REF_NAME" != "$FORK_DEFAULT_BRANCH" ]; then
            echo "A real run must be dispatched from $FORK_DEFAULT_BRANCH, not $REF_NAME." >&2
            exit 1
          fi

          # The fork tracks upstream stable releases, never nightlies. A stable tag is
          # v<major>.<minor>.<patch> and nothing else, so the grep drops every -nightly, -rc
          # and -beta. sort -V orders by version, not by date, so a nightly cut after v0.0.40
          # cannot win and v0.0.40 beats v0.0.9. An explicit upstream_ref still takes any ref,
          # which is how a nightly or a branch is merged on purpose.
          ref="${INPUT_UPSTREAM_REF:-}"
          picked_by_default=false
          if [ -z "$ref" ]; then
            picked_by_default=true
            ref=$(git ls-remote --tags --refs "$UPSTREAM_REMOTE" 'v*' \
              | awk '{ print $2 }' | sed 's#^refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          fi
          if [ -z "$ref" ]; then
            echo "Found no upstream stable release tag to merge." >&2
            exit 1
          fi
          git rev-parse --verify "${ref}^{commit}" > /dev/null

          # Upstream cuts a stable release every few weeks, so on most mornings the newest one
          # is already merged. Say so in one line and stop. No issue is filed, because nothing
          # is wrong. An explicit ref skips this check, so rebuilding a tag already merged is
          # still possible.
          up_to_date=false
          if [ "$picked_by_default" = true ] \
            && git merge-base --is-ancestor "$ref" "refs/remotes/origin/$FORK_DEFAULT_BRANCH"; then
            up_to_date=true
          fi

          {
            echo "upstream_ref=$ref"
            echo "base_sha=$(git rev-parse HEAD)"
            echo "dry_run=$dry_run"
            echo "up_to_date=$up_to_date"
          } >> "$GITHUB_OUTPUT"

          if [ "$up_to_date" = true ]; then
            echo "Upstream $ref is already on $FORK_DEFAULT_BRANCH. Nothing to do."
            exit 0
          fi

          echo "Merging $ref into $REF_NAME at $(git rev-parse --short HEAD). dry_run=$dry_run."

      - name: Merge upstream into the fork
        id: merge
        # Nothing new upstream. Every step below reads a merge that never happened, so they all
        # stop here and the job ends green.
        if: steps.resolve.outputs.up_to_date != 'true'
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.resolve.outputs.upstream_ref }}
        run: |
          # No -e in this step. The merge below is allowed to fail, because the step reads
          # its exit code. So the two calls above the merge carry their own guard.
          set -uo pipefail
          git config user.name "github-actions[bot]" || { echo "git config user.name failed"; exit 1; }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || { echo "git config user.email failed"; exit 1; }

          # Merge, never rebase (#60). A rebase would rewrite the fork's own history.
          if git merge --no-ff --no-edit -m "chore: merge upstream $UPSTREAM_REF" "$UPSTREAM_REF"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A conflict leaves unmerged paths behind. A merge that fails with none of them
          # broke for another reason, and reporting that as a conflict would send a worker to
          # resolve files that are not there.
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          if [ ! -s "$RUNNER_TEMP/conflicts.txt" ]; then
            echo "The merge failed and left no conflicting files. Read the git output above." >&2
            git merge --abort || true
            exit 1
          fi

          git merge --abort
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          echo "The merge stopped on these files:"
          cat "$RUNNER_TEMP/conflicts.txt"

      - name: Write the conflict report
        id: conflict_report
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.resolve.outputs.upstream_ref }}
        run: |
          set -euo pipefail
          {
            echo "\`$UPSTREAM_REF\` does not merge into \`$FORK_DEFAULT_BRANCH\` cleanly."
            echo "The fork update workflow aborted the merge. It published nothing and pushed nothing."
            echo ""
            echo "Conflicting files:"
            echo ""
            sed -e 's|^|- `|' -e 's|$|`|' "$RUNNER_TEMP/conflicts.txt"
            echo ""
            echo "Resolve it with the fixed brief in \`docs/agents/upstream-conflict-resolution.md\`."
            echo "Take upstream for every conflicting hunk, unless a \`keep\` line in \`fork-features.json\` names the file."
            echo "Apply that keep line where it does, run the gate, open one pull request. Merge, never rebase (#60)."
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/conflict-issue.md"
          {
            echo "body<<FORK_UPDATE_EOF"
            cat "$RUNNER_TEMP/conflict-issue.md"
            echo "FORK_UPDATE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report the conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: ./.github/actions/report-fork-update-issue
        with:
          title: Upstream ${{ steps.resolve.outputs.upstream_ref }} conflicts with fork
          body: ${{ steps.conflict_report.outputs.body }}
          token: ${{ github.token }}

      - name: Stop on the conflict
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        run: exit 1

      - name: Setup Vite+
        if: steps.resolve.outputs.up_to_date != 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install
        if: steps.resolve.outputs.up_to_date != 'true'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm install --frozen-lockfile

      # `pnpm test` runs the desktop suites, which need the Electron runtime. Same step ci.yml runs.
      - name: Ensure Electron runtime is installed
        if: steps.resolve.outputs.up_to_date != 'true'
        run: pnpm run --filter @t3tools/desktop ensure:electron

      # apps/desktop/scripts/browser-secret-native.test.mjs compiles native/browser-secret
      # against libsecret, so on Linux `pnpm test` needs the headers and pkg-config. Without
      # them the gate dies on "Package libsecret-1 was not found in the pkg-config search
      # path". Run 34544913834 is that failure.
      #
      # ci.yml installs the same two packages, but prefixes them with a sed over
      # /etc/apt/blacksmith-ubuntu-mirrors.txt. That file comes from a Blacksmith runner.
      # This job runs on ubuntu-latest, where sed on a missing path exits 2 and would fail
      # the step, so the mirror rewrite is not copied.
      - name: Install browser secret helper build libraries
        if: steps.resolve.outputs.up_to_date != 'true'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Gate
        id: gate
        if: steps.resolve.outputs.up_to_date != 'true'
        shell: bash
        run: |
          set -uo pipefail
          run_gate_step() {
            name="$1"
            shift
            echo "::group::$name"
            if ! "$@"; then
              echo "::endgroup::"
              echo "failed_step=$name" >> "$GITHUB_OUTPUT"
              echo "The gate failed on: $name" >&2
              exit 1
            fi
            echo "::endgroup::"
          }

          run_gate_step "pnpm typecheck" pnpm typecheck
          run_gate_step "pnpm lint" pnpm lint
          run_gate_step "pnpm test" pnpm test
          run_gate_step "node scripts/check-fork-features.ts" node scripts/check-fork-features.ts

      - name: Write the gate report
        id: gate_report
        if: failure() && steps.gate.outcome == 'failure'
        shell: bash
        env:
          UPSTREAM_REF: ${{ steps.resolve.outputs.upstream_ref }}
          FAILED_STEP: ${{ steps.gate.outputs.failed_step }}
        run: |
          set -euo pipefail
          {
            echo "\`$UPSTREAM_REF\` merges into \`$FORK_DEFAULT_BRANCH\` cleanly, then fails the fork gate."
            echo "The fork update workflow published nothing and pushed nothing."
            echo ""
            echo "Failing step: \`${FAILED_STEP:-unknown}\`"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/gate-issue.md"
          {
            echo "body<<FORK_UPDATE_EOF"
            cat "$RUNNER_TEMP/gate-issue.md"
            echo "FORK_UPDATE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report the gate failure
        if: failure() && steps.gate.outcome == 'failure'
        uses: ./.github/actions/report-fork-update-issue
        with:
          title: Upstream ${{ steps.resolve.outputs.upstream_ref }} breaks the fork gate
          body: ${{ steps.gate_report.outputs.body }}
          token: ${{ github.token }}

  release:
    name: Build, smoke and publish
    needs: gate
    # Nothing new upstream. There is nothing to build.
    if: needs.gate.outputs.up_to_date != 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REF: ${{ needs.gate.outputs.upstream_ref }}
      DRY_RUN: ${{ needs.gate.outputs.dry_run }}
    steps:
      - name: Checkout the commit the gate passed
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          # No sparse-checkout, for the reason the gate's checkout gives: it would make this a
          # partial clone and the merge below could not read upstream's blobs.
          fetch-depth: 0

      - name: Merge upstream into the fork
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REMOTE"
          git fetch --tags --force upstream
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The gate proved this merge is clean at this commit, so a conflict here is a bug.
          git merge --no-ff --no-edit -m "chore: merge upstream $UPSTREAM_REF" "$UPSTREAM_REF"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        shell: bash
        run: pnpm run --filter @t3tools/desktop ensure:electron

      - name: Resolve the fork version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Version scheme: <upstream base version>-ap.<n>. A fork release is named after the
          # upstream release it contains, so v0.0.33 builds 0.0.33-ap.1. That is the rule the
          # `chore(release): prepare` commits on main already follow.
          #
          # The patch is not bumped. Bumping it made v0.0.33 build 0.0.34-ap.1, which claims a
          # version this build does not carry and collides with the v0.0.34 upstream later cuts.
          # The fork's update feed holds only the fork's own releases, so nothing has to sort
          # above an upstream version; it only has to sort above the previous fork build, and
          # -ap.<n> does that.
          current=$(node -p "require('./apps/desktop/package.json').version")

          base="${UPSTREAM_REF#v}"
          base="${base%%-*}"
          if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # A branch ref carries no version. Keep the base the fork is already on and move
            # only <n>, so a merge of origin/main at 0.0.33-ap.1 builds 0.0.33-ap.2.
            base="${current%%-*}"
            echo "Ref '$UPSTREAM_REF' carries no version. Building on $base."
          fi

          # <n> is one above the highest -ap suffix already used for this base version, read
          # from the current package version and from the tags, so a second run on the same
          # upstream tag still sorts above the first.
          highest=0
          case "$current" in
            "$base-ap."*)
              suffix="${current##*-ap.}"
              case "$suffix" in
                ''|*[!0-9]*) ;;
                *) highest="$suffix" ;;
              esac
              ;;
          esac
          for tag in $(git tag --list "v$base-ap.*"); do
            suffix="${tag##*-ap.}"
            case "$suffix" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "$suffix" -gt "$highest" ]; then highest="$suffix"; fi
          done

          version="$base-ap.$((highest + 1))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Fork version: $version. Upstream: $UPSTREAM_REF. Installed: $current."

      - name: Bump the fork version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$VERSION"
          git add -A
          git commit -m "chore(release): prepare $VERSION"

      - name: Build the unsigned Windows installer
        id: build
        shell: bash
        env:
          # The build reads its update source here. This is what points the installed fork at
          # the fork's own releases instead of upstream's. See scripts/build-desktop-artifact.ts.
          T3CODE_DESKTOP_UPDATE_REPOSITORY: autoprintworks/t3code
        # T3 Connect needs no step here. The runner checkout has no .env, so the build copies
        # .env.example to .env itself (scripts/lib/fork-public-env.ts) and this installer carries
        # the same public Clerk and relay values as a local build. See
        # docs/operations/fork-windows-build.md.
        run: pnpm dist:desktop:win

      - name: Release smoke
        id: smoke
        shell: bash
        run: pnpm release:smoke

      - name: Collect the release files
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release/*.exe release/*.exe.blockmap release/*.yml; do
            # electron-builder writes builder-debug.yml next to the channel file. It is a
            # build log, not something the updater reads, and it makes the count below
            # see two manifests.
            if [ "$(basename "$file")" = "builder-debug.yml" ]; then
              continue
            fi
            cp "$file" release-publish/
          done

          installers=(release-publish/*.exe)
          blockmaps=(release-publish/*.exe.blockmap)
          manifests=(release-publish/*.yml)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#blockmaps[@]}" -ne 1 ] || [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected one installer, one blockmap and one channel file. Found:" >&2
            ls -l release-publish >&2
            exit 1
          fi

          # The channel file is what the desktop updater reads. resolveDesktopUpdateChannel
          # returns "latest" for an -ap version, so this is latest.yml.
          echo "manifest=$(basename "${manifests[0]}")" >> "$GITHUB_OUTPUT"
          ls -l release-publish

      - name: Upload the installer
        if: env.DRY_RUN != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: fork-installer-${{ steps.version.outputs.version }}
          path: release-publish/*
          if-no-files-found: error

      - name: Stop before push and before publish
        if: env.DRY_RUN != 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MANIFEST: ${{ steps.assets.outputs.manifest }}
        run: echo "Dry run. Built $VERSION with $MANIFEST. Published nothing. Pushed nothing."

      - name: Push the merge and the version bump
        id: push
        # Only an explicit false publishes and pushes. An empty or missing value is a dry run,
        # so a defect upstream of this job cannot publish by omission.
        if: env.DRY_RUN == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # First, so the tag the release carries names a commit that is on the default branch.
          # A release created before the push has nothing on the default branch to tag, and
          # GitHub falls back to that branch's current head, which is not the tree this job
          # built. A rejected push means the default branch moved after the gate ran, and
          # nothing is published at that point. Run the workflow again.
          merged_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$FORK_DEFAULT_BRANCH"
          echo "merged_sha=$merged_sha" >> "$GITHUB_OUTPUT"

      - name: Publish the fork release
        id: publish
        if: env.DRY_RUN == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MERGED_SHA: ${{ steps.push.outputs.merged_sha }}
        run: |
          set -euo pipefail
          # --target pins the tag to the commit this job built and pushed one step ago.
          # Without it GitHub tags whatever the default branch head is when the call lands.
          # Not a prerelease and not a draft. The desktop app's "latest" channel resolves the
          # tag through /releases/latest, which skips both.
          gh release create "v$VERSION" release-publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGED_SHA" \
            --title "T3 Code Fork $VERSION" \
            --latest \
            --notes "Fork build of upstream \`$UPSTREAM_REF\` with every fork change kept. The Windows installer is unsigned, so SmartScreen warns on first run."

      - name: Write the build failure report
        id: build_report
        if: failure()
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          ASSETS_OUTCOME: ${{ steps.assets.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail

          # The release job runs one step after another, so the first step that reports a
          # failure is the one that broke.
          failed_step="a step before the Windows build"
          if [ "$BUILD_OUTCOME" = "failure" ]; then
            failed_step="Build the unsigned Windows installer"
          elif [ "$SMOKE_OUTCOME" = "failure" ]; then
            failed_step="Release smoke"
          elif [ "$ASSETS_OUTCOME" = "failure" ]; then
            failed_step="Collect the release files"
          elif [ "$PUSH_OUTCOME" = "failure" ]; then
            failed_step="Push the merge and the version bump"
          elif [ "$PUBLISH_OUTCOME" = "failure" ]; then
            failed_step="Publish the fork release"
          elif [ "$BUILD_OUTCOME" = "success" ]; then
            failed_step="a step after the Windows build that carries no id"
          fi

          # Say what is on the repository now, rather than assuming. A release can exist by
          # the time a later step fails, and a half-made release has to be seen by a human.
          if [ -n "${VERSION:-}" ] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_state="Release \`v$VERSION\` exists. Look at it before running this again."
          else
            release_state="No fork release was published by this run."
          fi

          case "$PUSH_OUTCOME" in
            success) push_state="The merge and the version bump are on \`$FORK_DEFAULT_BRANCH\`." ;;
            failure) push_state="The push to \`$FORK_DEFAULT_BRANCH\` was rejected." ;;
            *) push_state="Nothing was pushed to \`$FORK_DEFAULT_BRANCH\`." ;;
          esac

          {
            echo "\`$UPSTREAM_REF\` passed the fork gate, then the release job failed."
            echo ""
            echo "Failing step: $failed_step"
            echo ""
            echo "$release_state"
            echo "$push_state"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/build-issue.md"
          {
            echo "body<<FORK_UPDATE_EOF"
            cat "$RUNNER_TEMP/build-issue.md"
            echo "FORK_UPDATE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report the build failure
        if: failure()
        uses: ./.github/actions/report-fork-update-issue
        with:
          # Its own title. The action dedupes on an exact title match, so sharing the gate's
          # title would file a build failure as a comment on a merge-conflict issue.
          title: Upstream ${{ needs.gate.outputs.upstream_ref }} fails the fork release build
          body: ${{ steps.build_report.outputs.body }}
          token: ${{ github.token }}
